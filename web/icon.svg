<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="64" fill="#1a1a2e"/>
  <g transform="translate(256,240)">
    <!-- Plate circle -->
    <circle cx="0" cy="0" r="140" fill="none" stroke="#fff" stroke-width="8"/>
    <!-- Fork icon -->
    <path d="M-70,-80 L-70,-20 M-60,-80 L-60,-20 M-50,-80 L-50,-20" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
    <path d="M-60,-20 Q-60,10 -40,10" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
    <!-- Chart bar left -->
    <rect x="-30" y="-50" width="20" height="50" rx="4" fill="#e74c3c"/>
    <rect x="0" y="-70" width="20" height="70" rx="4" fill="#3498db"/>
    <rect x="30" y="-30" width="20" height="30" rx="4" fill="#f39c12"/>
    <rect x="60" y="-60" width="20" height="60" rx="4" fill="#9b59b6"/>
